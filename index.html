<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter carries the body text: Google Sans Flex ships a 400 weight only,
         so every bold in the app used to be a browser-synthesised smear of it. -->
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Google+Sans+Flex&family=Press+Start+2P&family=Shojumaru&display=swap" rel="stylesheet">
    <title>AVANT CleverSpace</title>
    <link rel="preload" as="image" href="/avant-logo.png" />
    <style>
      /* Start-up loader: AVANT logo above a large CleverSpace EduPortal title, with a progress bar beneath that fills
         left to right, yellow to green. Lives here (not theme.css) so it shows
         before any JavaScript loads; App.jsx reuses the same markup while data
         loads and offsets the animation by the time already elapsed, so the bar
         carries on instead of restarting. */
      /* The bottom padding reserves the space the sign-in buttons will take, so
         the logo and title sit at exactly the same height before and after the
         app mounts and nothing jumps when the loader gives way. */
      .boot-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0 16px 104px; z-index: 50;
        background: linear-gradient(160deg, #0a1628 0%, #0d1f3c 40%, #122a4e 100%); }
      /* Same logo and title as the sign-in screen behind it, so the loader
         becomes the sign-in screen rather than being replaced by one. */
      .boot-logo { width: 200px; max-width: 60vw; margin-bottom: 16px; line-height: 0; }
      .boot-title { margin: 0 0 4px; font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 2.8rem; letter-spacing: -0.5px; line-height: 1.2; text-align: center;
        background: linear-gradient(90deg, #ffffff 0%, #b8d4f0 20%, #e8f0ff 40%, #a0c4e8 60%, #d0e4ff 80%, #ffffff 100%);
        background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        animation: boot-cloud-shimmer 8s ease-in-out infinite; }
      @keyframes boot-cloud-shimmer { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
      .boot-logo img { width: 100%; height: auto; display: block; user-select: none; -webkit-user-drag: none; }
      .boot-bar { position: relative; margin-top: 36px; width: 30vw; min-width: 240px; max-width: 90vw; height: 14px; border-radius: 999px; overflow: hidden;
        background: rgba(255, 255, 255, .08); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .5); }
      /* The fill reveals a fixed yellow-to-green gradient, so the leading edge turns greener as it grows. */
      .boot-bar-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; overflow: hidden;
        animation: boot-progress 9s cubic-bezier(.12, .7, .25, 1) forwards; }
      .boot-bar-fill::before { content: ''; position: absolute; inset: 0 auto 0 0; width: var(--boot-bar-w, 30vw); min-width: 240px; max-width: 90vw;
        background: linear-gradient(90deg, #ffd400 0%, #c6e600 45%, #22c55e 100%); }
      .boot-bar-fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent);
        transform: translateX(-100%); animation: boot-shine 1.6s ease-in-out infinite; }
      /* The caption rides on the bar, so it has to read against the yellow and
         green fill as well as the empty track: dark ink with a light halo. */
      /* -11px centres the caption's box on the 14px bar; the left padding gives
         back the trailing gap letter-spacing adds after the last character, so
         the word is optically centred too. */
      .boot-text { position: relative; z-index: 2; margin-top: -11px; padding-left: .28em; font-family: 'Press Start 2P', monospace; font-size: .5rem; letter-spacing: .28em;
        line-height: 1; text-transform: uppercase; color: #06240f; text-shadow: 0 1px 0 rgba(255, 255, 255, .65), 0 0 6px rgba(255, 255, 255, .45); }
      /* Races ahead, then slows near the end: it never claims "done" before the app is ready. */
      @keyframes boot-progress { 0% { width: 0; } 20% { width: 45%; } 50% { width: 72%; } 100% { width: 94%; } }
      @keyframes boot-shine { to { transform: translateX(100%); } }
      /* Loaded: the screen fades out once the bar has reached 100%. */
      .boot-loader.is-leaving { opacity: 0; transition: opacity .5s ease; pointer-events: none; }
      .boot-loader .boot-text { transition: opacity .3s ease; }
      @media (prefers-reduced-motion: reduce) { .boot-bar-fill { animation: none; width: 70%; } .boot-bar-fill::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-label="Loading">
        <div class="boot-logo"><img src="/avant-logo.png" alt="AVANT OC &amp; Selective" /></div>
        <h1 class="boot-title">Cleverspace EduPortal</h1>
        <div class="boot-bar"><div class="boot-bar-fill"></div></div>
        <div class="boot-text">Loading</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Cinzel:wght@700&family=Outfit:wght@500;600;700;800&family=Google+Sans+Flex:wght@400;500;600;700&family=Press+Start+2P&family=Shojumaru&display=swap" rel="stylesheet">
    <title>AVANT CleverSpace</title>
    <link rel="preload" as="image" href="/avant-logo.png" />
    <style>
      /* Start-up loader: large AVANT logo with a progress bar beneath it that fills
         left to right, yellow to green. Lives here (not theme.css) so it shows
         before any JavaScript loads; App.jsx reuses the same markup while data
         loads and offsets the animation by the time already elapsed, so the bar
         carries on instead of restarting. */
      .boot-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(20px, 4vh, 40px); padding: 0 16px; background: #1a1a2e; z-index: 50; }
      .boot-logo { width: 30vw; min-width: 240px; max-width: 90vw; line-height: 0; }
      .boot-logo img { width: 100%; height: auto; display: block; user-select: none; -webkit-user-drag: none; }
      .boot-bar { position: relative; width: 30vw; min-width: 240px; max-width: 90vw; height: 14px; border-radius: 999px; overflow: hidden;
        background: rgba(255, 255, 255, .08); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .5); }
      /* The fill reveals a fixed yellow-to-green gradient, so the leading edge turns greener as it grows. */
      .boot-bar-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; overflow: hidden;
        animation: boot-progress 9s cubic-bezier(.12, .7, .25, 1) forwards; }
      .boot-bar-fill::before { content: ''; position: absolute; inset: 0 auto 0 0; width: var(--boot-bar-w, 30vw); min-width: 240px; max-width: 90vw;
        background: linear-gradient(90deg, #ffd400 0%, #c6e600 45%, #22c55e 100%); }
      .boot-bar-fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent);
        transform: translateX(-100%); animation: boot-shine 1.6s ease-in-out infinite; }
      .boot-text { font-family: 'Google Sans Flex', 'Segoe UI', sans-serif; font-size: .8rem; letter-spacing: .3em; text-transform: uppercase; color: #a0a0b0; margin-top: -8px; }
      /* Races ahead, then slows near the end: it never claims "done" before the app is ready. */
      @keyframes boot-progress { 0% { width: 0; } 20% { width: 45%; } 50% { width: 72%; } 100% { width: 94%; } }
      @keyframes boot-shine { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar-fill { animation: none; width: 70%; } .boot-bar-fill::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-label="Loading">
        <div class="boot-logo"><img src="/avant-logo.png" alt="AVANT OC &amp; Selective" /></div>
        <div class="boot-bar"><div class="boot-bar-fill"></div></div>
        <div class="boot-text">Loading</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
